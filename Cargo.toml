[workspace]

[package]
name = "magnetar-component-smollm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "SmolLM model component for the Magnetar inference runtime."
repository = "https://github.com/astorise/Magnetar-component-SmolLM"
readme = "README.md"
rust-version = "1.98"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
